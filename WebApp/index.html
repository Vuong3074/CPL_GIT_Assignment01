<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Simple Web App</title>
</head>
<body>

    <h1>Simple Web App</h1>
<button onclick="sayHello()">Xin chào</button>

<script>
    function sayHello() {
        alert("xin chào");
    }
</script>
<button onclick="sayHello()">Xin chào</button>
<button onclick="sayBye()">Tạm biệt</button>

<script>
    function sayHello() {
        alert("xin chào");
    }

    function sayBye() {
        alert("tạm biệt");
    }
</script>

</body>
</html>
